plugins {
    id 'com.android.application'
}

android {
    namespace 'com.almahadali.reminders'
    compileSdk 36

    defaultConfig {
        applicationId 'com.almahadali.reminders'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '0.2.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Keep the editable source tree shallow. Android resource type folders
    // (res/drawable, res/layout, res/values, etc.) are still required by Android.
    sourceSets {
        main {
            manifest.srcFile 'src/AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['src/res']
        }
        test {
            java.srcDirs = ['test']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'

    testImplementation 'junit:junit:4.13.2'
}
