<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#821b20">
  <title>تذكيراتي — نسخة الويب</title>
  <link rel="canonical" href="https://mycard.almahad-alali.com/reminders/app.html">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell app-shell">
    <section class="panel">
      <div class="app-top">
        <img src="assets/Logo_Ar_Red.png" alt="شعار المعهد العالي" class="app-logo">
        <div><p class="eyebrow dark">نسخة الويب دون اتصال</p><h1>تذكيراتي</h1></div>
        <a class="text-link" href="index.html">صفحة التحميل</a>
      </div>

      <nav class="tabs" aria-label="التنقل">
        <button data-tab="reminders" class="active">التذكيرات</button>
        <button data-tab="favorites">المفضلة</button>
        <button data-tab="analytics">التحليل</button>
        <button data-tab="settings">الإعدادات</button>
      </nav>

      <section id="reminder-tools" class="app-content">
        <div class="toolbar">
          <input id="search" type="search" placeholder="ابحث في التذكيرات">
          <select id="sort">
            <option value="alert">وقت التنبيه</option>
            <option value="title">العنوان</option>
            <option value="modified">تاريخ التعديل</option>
            <option value="category">الفئة</option>
          </select>
          <select id="direction"><option value="asc">تصاعدي</option><option value="desc">تنازلي</option></select>
          <button class="button primary" id="new-reminder">+ تذكير جديد</button>
        </div>
      </section>

      <section id="view" class="app-content" aria-live="polite"></section>

      <section class="install-note" id="install">
        <b>للاستخدام دون اتصال:</b> افتح هذه الصفحة مرة واحدة أثناء الاتصال، ثم أضفها إلى الشاشة الرئيسية.
        تنبيهات الويب قد لا تعمل بعد إغلاق المتصفح؛ استخدم تطبيق أندرويد للتنبيهات الخلفية الموثوقة.
      </section>

      <footer class="footer compact">
        <img src="assets/Logo_Ar_Red.png" alt="" class="footer-logo">
        <p>صُمّم وبُني وتتم صيانته بواسطة المعهد العالي</p>
      </footer>
    </section>
  </main>

  <dialog id="editor">
    <form method="dialog" id="reminder-form">
      <div class="dialog-head"><h2 id="editor-title">تذكير جديد</h2><button type="button" data-editor-close class="icon-close" aria-label="إغلاق">×</button></div>
      <input type="hidden" id="reminder-id">
      <div class="form-grid">
        <label class="field full"><span>العنوان</span><input id="title" required></label>
        <label class="field full"><span>الملاحظات</span><textarea id="notes" rows="5"></textarea></label>
        <div class="note-actions full">
          <button type="button" data-prefix="• ">• قائمة</button>
          <button type="button" data-prefix="☐ ">☐ مهام</button>
          <button type="button" id="numbered-note">1. ترقيم تلقائي</button>
        </div>
        <label class="field"><span>الفئة</span><select id="category"></select></label>
        <label class="field"><span>فئة مخصصة</span><input id="custom-category" placeholder="🎁 هدايا"></label>
        <label class="field"><span>المكان</span><input id="location"></label>
        <label class="checkbox-field"><input id="favorite" type="checkbox"><span>إضافة إلى المفضلة</span></label>
        <label class="field"><span>نوع التذكير</span>
          <select id="mode">
            <option value="once">مرة واحدة</option>
            <option value="range">ضمن نطاق زمني</option>
            <option value="interval">تكرار مستمر</option>
          </select>
        </label>
        <label class="field"><span>تاريخ ووقت البدء</span><input id="start-at" type="datetime-local" required></label>
        <label class="field repeat-field"><span>التكرار كل كم دقيقة؟</span><input id="interval" type="number" min="1" value="60"></label>
        <label class="field range-field"><span>من الساعة</span><input id="range-start" type="time" value="08:00"></label>
        <label class="field range-field"><span>إلى الساعة</span><input id="range-end" type="time" value="17:00"></label>
        <fieldset class="days range-field full"><legend>الأيام</legend></fieldset>
        <label class="field"><span>تنبيه مبكر بالدقائق</span><input id="early" type="number" min="0" value="0"></label>
        <label class="field"><span>الشدة</span><select id="intensity"><option>خفيفة</option><option selected>متوسطة</option><option>قوية</option></select></label>
        <label class="checkbox-field"><input id="enabled" type="checkbox" checked><span>التذكير مفعّل</span></label>
      </div>
      <div class="dialog-actions">
        <button type="button" data-editor-close class="button ghost">إلغاء</button>
        <button type="submit" value="default" class="button primary">حفظ</button>
      </div>
    </form>
  </dialog>

  <dialog id="details"><div id="details-content"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
