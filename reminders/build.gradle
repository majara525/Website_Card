plugins {
    id 'com.android.application' version '8.13.0' apply false
}

def remindersBuildRoot = providers.environmentVariable('REMINDERS_BUILD_DIR').getOrElse('.build')
rootProject.layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("${remindersBuildRoot}/root"))
subprojects {
    layout.buildDirectory.set(rootProject.layout.projectDirectory.dir("${remindersBuildRoot}/${project.name}"))
}
