<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <!-- Google tag (gtag.js), matching chat.html -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PPFD0FVEP6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PPFD0FVEP6');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b92b31">
  <title>هُدى | المعهد العالي</title>
  <link rel="icon" type="image/png" href="Favicon_Transparent.png">
  <style>
    :root {
      --red:#b92b31;
      --red-dark:#932126;
      --yellow:#fbc23a;
      --black:#171717;
      --gray:#d1d5db;
      --muted:#686868;
      --line:#dedede;
      --white:#fff
    }
    * {
      box-sizing:border-box
    }
    html {
      height:100%;
      overflow:hidden
    }
    body {
      margin:0;
      height:100dvh;
      overflow:hidden;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
      color:var(--black);
      background:linear-gradient(150deg,var(--red),var(--yellow) 64%,#e7e7e7);
      -webkit-tap-highlight-color:transparent
    }
    button,input,textarea {
      font:inherit
    }
    button {
      cursor:pointer
    }
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible {
      outline:3px solid var(--yellow);
      outline-offset:2px
    }
    .page {
      max-width:780px;
      height:100dvh;
      margin:0 auto;
      padding:22px 12px;
      display:flex;
      flex-direction:column;
      min-height:0
    }
    .card {
      background:white;
      box-shadow:0 14px 42px #0003;
      height:100%;
      min-height:0;
      display:flex;
      flex-direction:column;
      border:1px solid #ddd
    }
    .header {
      display:flex;
      align-items:center;
      gap:11px;
      padding:12px 15px;
      background:white;
      border-bottom:1px solid var(--line);
      min-height:77px;
      flex-shrink:0
    }
    .header .back {
      width:37px;
      height:37px;
      display:grid;
      place-items:center;
      color:var(--red);
      text-decoration:none;
      border:1px solid #ddd;
      border-radius:9px;
      flex-shrink:0
    }
    .avatar-wrap {
      position:relative;
      width:48px;
      height:48px;
      flex-shrink:0;
      border-radius:50%;
      background:#f1f1f1;
      border:1px solid #ddd;
      overflow:hidden;
      display:grid;
      place-items:center
    }
    .avatar-fallback {
      position:absolute;
      font-size:24px;
      color:var(--red);
      font-weight:700
    }
    .avatar {
      position:relative;
      width:100%;
      height:100%;
      border:0;
      border-radius:50%;
      padding:0;
      background:white;
      object-fit:cover;
      flex-shrink:0
    }
    .header-info {
      flex:1;
      min-width:0
    }
    .header-info strong {
      display:block;
      font-size:18px
    }
    .header-info small {
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-top:2px
    }
    .header-tools {
      display:flex;
      gap:6px;
      align-items:center
    }
    .header-tools .tool {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:5px
    }
    .header-tools svg {
      width:16px;
      height:16px;
      flex-shrink:0;
      fill:none;
      stroke:currentColor;
      stroke-width:1.9;
      stroke-linecap:round;
      stroke-linejoin:round
    }
    .tool {
      background:#f3f3f3;
      border:1px solid #ddd;
      border-radius:8px;
      min-height:36px;
      padding:6px 10px;
      font-size:12px;
      color:#222
    }
    .tool,.send,.menu-btn,.feedback-btn,.stars button {
      transition:transform .18s ease, background-color .18s ease, border-color .18s ease
    }
    .tool:hover:not(:disabled),.send:hover:not(:disabled),.menu-btn:hover:not(:disabled),.feedback-btn:hover:not(:disabled),.stars button:hover:not(:disabled) {
      transform:translateY(-3px)
    }
    .tool:active:not(:disabled),.send:active:not(:disabled),.menu-btn:active:not(:disabled),.feedback-btn:active:not(:disabled),.stars button:active:not(:disabled) {
      transform:translateY(2px) scale(.97)
    }
    .chat-box {
      flex:1;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior:contain;
      padding:20px 22px 24px;
      background:linear-gradient(#ffffffe0,#ffffffe0),url("Logo_Ar_Red.png") center center / 230px no-repeat;
      scroll-behavior:smooth;
      user-select:none;
      -webkit-user-select:none
    }
    .chat-box * {
      user-select:none;
      -webkit-user-select:none
    }
    .message {
      display:flex;
      flex-direction:column;
      max-width:100%;
      margin-bottom:15px;
      align-items:flex-start
    }
    .message.bot {
      align-items:flex-end
    }
    .message.user {
      align-items:flex-start
    }
    .bubble {
      position:relative;
      border-radius:16px;
      max-width:min(85%,540px);
      min-width:48px;
      padding:11px 15px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      line-height:1.75;
      box-shadow:0 3px 10px #00000012;
      font-size:15px;
      text-align:right
    }
    .bot .bubble {
      background:var(--red);
      color:#fff;
      border-bottom-left-radius:5px
    }
    .user .bubble {
      background:var(--gray);
      color:var(--black);
      border-bottom-right-radius:5px
    }
    .bot .bubble::after,.user .bubble::after,.agent .bubble::after {
      content:"";
      position:absolute;
      bottom:0;
      border:8px solid transparent
    }
    .bot .bubble::after {
      left:-8px;
      border-bottom-color:var(--red);
      border-right-color:var(--red)
    }
    .user .bubble::after {
      right:-8px;
      border-bottom-color:var(--gray);
      border-left-color:var(--gray)
    }
    .message.agent {
      align-items:flex-end
    }
    .agent .bubble {
      background:var(--yellow);
      color:var(--black);
      border-bottom-left-radius:5px
    }
    .agent .bubble::after {
      left:-8px;
      border-bottom-color:var(--yellow);
      border-right-color:var(--yellow)
    }
    .message-time {
      display:block;
      margin-top:4px;
      font-size:11px;
      line-height:1.2;
      color:inherit;
      opacity:.7;
      text-align:right;
      direction:ltr
    }
    .message a {
      color:inherit;
      text-decoration:underline;
      overflow-wrap:anywhere
    }
    .message-feedback {
      display:flex;
      gap:7px;
      margin:5px 3px 0;
      direction:ltr
    }
    .feedback-btn {
      border:1px solid #ddd;
      border-radius:7px;
      background:#fff;
      color:#333;
      padding:3px 8px;
      display:flex;
      align-items:center;
      gap:4px;
      min-width:34px;
      justify-content:center
    }
    .feedback-btn[aria-pressed="true"] {
      background:var(--yellow);
      border-color:#b38822
    }
    .feedback-btn svg {
      width:15px;
      height:15px;
      stroke:currentColor;
      fill:none;
      stroke-width:1.8
    }
    .menu {
      display:flex;
      flex-direction:column;
      gap:7px;
      margin-top:12px;
      width:100%
    }
    .menu-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:7px;
      width:100%
    }
    .menu-grid>.menu-btn:last-child:nth-child(odd) {
      grid-column:1/-1
    }
    .menu-btn {
      border:1px solid #ffffff7e;
      border-radius:9px;
      background:#fff;
      color:var(--black);
      padding:10px 8px;
      min-height:45px;
      line-height:1.4;
      text-align:center;
      font-size:13px;
      font-weight:650;
      white-space:normal;
      overflow-wrap:anywhere
    }
    .menu-btn-content {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:7px
    }
    .menu-btn svg {
      width:17px;
      height:17px;
      flex-shrink:0;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round
    }
    .branch-message .bubble {
      width:min(100%,620px);
      max-width:100%;
      padding:10px;
      overflow:visible;
      background:var(--red);
      color:#fff;
      border:1px solid var(--red);
      border-radius:9px;
      border-bottom-left-radius:0
    }
    .branch-message .bubble::after {
      left:-18px;
      bottom:-1px;
      width:20px;
      height:18px;
      border:0;
      background:var(--red);
      clip-path:polygon(100% 0,100% 100%,0 100%)
    }
    .branch-card {
      display:grid;
      grid-template-columns:minmax(0,1.4fr) minmax(115px,1fr);
      gap:12px;
      min-height:125px;
      direction:rtl;
      background:#fff;
      color:var(--black);
      border:1px solid #e5e7eb;
      border-radius:8px;
      overflow:hidden
    }
    .branch-details {
      display:flex;
      flex-direction:column;
      gap:5px;
      padding:11px 12px 11px 0;
      text-align:right
    }
    .branch-details strong {
      font-size:14px
    }
    .branch-hours {
      color:#6b7280;
      font-size:12px;
      line-height:1.6
    }
    .branch-details a {
      margin-top:auto;
      color:var(--red);
      font-size:12px;
      font-weight:700;
      text-decoration:none
    }
    .branch-details a:hover {
      text-decoration:underline
    }
    .branch-photo {
      width:100%;
      height:100%;
      min-height:125px;
      object-fit:cover
    }
    .branch-followup {
      margin:8px 4px 0;
      color:#fff;
      font-size:13px
    }
    .social-links {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      margin-top:10px
    }
    .social-links a {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-height:44px;
      padding:6px;
      border-radius:8px;
      background:#fff;
      color:var(--black);
      font-size:12px;
      font-weight:600;
      text-decoration:none;
      transition:transform .18s ease, background-color .18s ease
    }
    .social-links a:hover {
      background:var(--yellow);
      transform:translateY(-3px)
    }
    .social-links a:active {
      transform:translateY(2px) scale(.97)
    }
    .social-links img {
      width:24px;
      height:24px;
      object-fit:contain;
      border-radius:7px
    }
    .menu-btn:hover {
      background:var(--yellow);
      border-color:var(--yellow)
    }
    .menu-btn.secondary {
      background:transparent;
      color:white;
      border-color:#ffffffa8
    }
    .menu-btn.secondary:hover {
      background:#ffffff20
    }
    .menu-btn.full {
      grid-column:1/-1
    }
    .menu .menu-label {
      font-weight:700;
      font-size:14px
    }
    .typing-bubble {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      direction:ltr;
      min-width:74px;
      min-height:43px;
      white-space:normal
    }
    .typing-dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:#fff;
      display:inline-block;
      animation:huda-dot 1.05s ease-in-out infinite
    }
    .typing-dot:nth-child(2) {
      animation-delay:.16s
    }
    .typing-dot:nth-child(3) {
      animation-delay:.32s
    }
    @keyframes huda-dot {
      0%,62%,100% {
        transform:translateY(0);
        opacity:.65
      }
      30% {
        transform:translateY(-7px);
        opacity:1
      }
    }
    .typing-caption {
      font-size:11px;
      color:var(--muted);
      margin:4px 6px 0
    }
    .composer-area {
      background:white;
      border-top:1px solid var(--line);
      padding:9px 13px 8px;
      flex-shrink:0
    }
    .composer {
      display:flex;
      align-items:stretch;
      gap:9px
    }
    .composer input {
      flex:1;
      min-width:0;
      min-height:48px;
      border:1px solid #aaa;
      border-radius:8px;
      padding:12px 14px;
      text-align:right;
      font-size:16px;
      color:var(--black);
      background:white
    }
    .send {
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      background:var(--yellow);
      border:0;
      border-radius:8px;
      width:55px;
      color:var(--black)
    }
    .send:hover {
      filter:brightness(.97)
    }
    .send:disabled {
      opacity:.55;
      cursor:default
    }
    .send svg {
      width:23px;
      height:23px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      transform:translate(2px,1px) rotate(-45deg) scaleX(-1)
    }
    .status {
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
      text-align:center
    }
    .status:empty {
      display:none
    }
    .disclaimer {
      font-size:10px;
      line-height:1.5;
      color:#555;
      text-align:center;
      margin:3px 3px 0
    }
    .chat-link {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:var(--yellow);
      color:var(--black)!important;
      text-decoration:none!important;
      border-radius:8px;
      padding:9px 12px;
      margin-top:7px;
      font-weight:700
    }
    .modal {
      position:fixed;
      inset:0;
      z-index:50;
      display:none;
      align-items:center;
      justify-content:center;
      padding:12px;
      background:#0009
    }
    .modal.open {
      display:flex
    }
    .modal,.modal * {
      user-select:none;
      -webkit-user-select:none
    }
    .modal-panel {
      background:#fff;
      border-radius:13px;
      max-width:780px;
      width:100%;
      height:min(628px,calc(100dvh - 24px));
      display:flex;
      flex-direction:column;
      overflow:hidden;
      box-shadow:0 16px 60px #0005
    }
    .modal-header {
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid #ddd
    }
    .modal-header strong {
      font-size:16px
    }
    .modal-frame {
      display:block;
      width:calc(100% + 56px);
      height:calc(100% + 126px);
      border:0;
      background:#f4f4f4;
      margin-inline:-28px;
      transform:translateY(-70px)
    }
    .modal-frame-viewport {
      flex:1;
      min-height:0;
      overflow:hidden
    }
    .modal-actions {
      display:flex;
      gap:8px;
      padding:10px;
      border-top:1px solid #ddd;
      background:#fff;
      position:relative;
      z-index:1
    }
    .modal-actions button,.modal-actions a {
      flex:1;
      text-align:center;
      border:1px solid #aaa;
      border-radius:8px;
      color:var(--black);
      background:white;
      padding:10px;
      text-decoration:none;
      font-size:13px
    }
    .modal-actions .yellow {
      background:var(--yellow);
      border-color:var(--yellow)
    }
    .rating {
      background:#fff;
      padding:20px;
      width:min(100%,440px);
      border-radius:13px;
      box-shadow:0 16px 60px #0005
    }
    .rating h2 {
      font-size:16px;
      margin:0 0 10px
    }
    .stars {
      display:flex;
      gap:5px;
      justify-content:center;
      direction:ltr
    }
    .stars button {
      background:transparent;
      border:0;
      font-size:30px;
      color:#9a9a9a
    }
    .stars button.selected {
      color:#bc8b00
    }
    .rating textarea {
      display:block;
      width:100%;
      resize:vertical;
      min-height:60px;
      margin:10px 0;
      padding:9px;
      border-radius:8px;
      border:1px solid #bbb;
      user-select:text;
      -webkit-user-select:text
    }
    .rating-actions {
      display:flex;
      gap:8px;
      justify-content:space-between
    }
    .rating-actions .tool {
      flex:1
    }
    .rating-actions .primary {
      background:var(--yellow);
      border-color:var(--yellow);
      font-weight:700
    }
    @media(max-width:620px) {
      .page {
        padding:0;
        height:100dvh
      }
      .card {
        height:100%
      }
      .bubble {
        max-width:91%;
        font-size:14px
      }
      .menu-grid {
        grid-template-columns:1fr 1fr
      }
      .menu-btn {
        font-size:12px
      }
      .header {
        display:grid;
        grid-template-columns:37px 43px minmax(0,1fr);
        align-items:center;
        padding:9px 11px;
        min-height:66px
      }
      .header-tools {
        grid-column:1/-1;
        width:100%;
        min-width:0;
        justify-content:center
      }
      .header-tools .tool {
        flex:1;
        padding:6px 3px;
        font-size:11px
      }
      .avatar-wrap {
        width:43px;
        height:43px
      }
      .tool {
        padding:5px 7px
      }
      .composer-area {
        padding-bottom:max(10px,env(safe-area-inset-bottom))
      }
      .modal-frame {
        height:calc(100% + 98px)
      }
    }
    @media(prefers-reduced-motion:reduce) {
      .tool,.send,.menu-btn,.feedback-btn,.stars button,.social-links a {
        transition:none
      }
      .tool:hover:not(:disabled),.send:hover:not(:disabled),.menu-btn:hover:not(:disabled),.feedback-btn:hover:not(:disabled),.stars button:hover:not(:disabled),.social-links a:hover {
        transform:none
      }
      .typing-dot {
        animation:none
      }
      .chat-box {
        scroll-behavior:auto
      }
    }
  </style>
</head>
<body>
  <main class="page"><div class="card">
    <header class="header">
      <a class="back" href="https://mycard.almahad-alali.com" aria-label="العودة إلى موقع المعهد" title="العودة إلى موقع المعهد">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
      </a>
      <div class="avatar-wrap"><span class="avatar-fallback" aria-hidden="true">ه</span><img class="avatar" src="Huda.png" alt="هُدى"></div>
      <div class="header-info"><strong>هُدى</strong><small>المعهد العالي - شبكة كُلّيات قُطرية</small></div>
      <div class="header-tools">
        <button type="button" class="tool" id="homeMenuBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>القائمة</button>
        <button type="button" class="tool" id="newChatBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>محادثة جديدة</button>
        <button type="button" class="tool" id="endChatBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg><span id="endChatLabel">إنهاء وتقييم</span></button>
      </div>
    </header>
    <section class="chat-box" id="chatBox" aria-label="محادثة هدى" aria-live="polite" aria-relevant="additions">
      <div id="messages"></div>
    </section>
    <div class="composer-area">
      <div class="composer">
        <input id="messageInput" type="text" autocomplete="off" inputmode="text" maxlength="3000" placeholder="اكتب/ي سؤالك هنا ..." aria-label="اكتب رسالتك إلى هدى">
        <button type="button" class="send" id="sendBtn" aria-label="إرسال الرسالة" title="إرسال الرسالة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L10 14"/><path d="M21 3L14.5 21L10 14L3 9.5L21 3Z"/></svg>
        </button>
      </div>
      <div id="status" class="status" role="status"></div>
      <div class="disclaimer">هُدى مساعدة ذكية وقد تخطئ أحياناً. للمعلومات الرسمية والمؤكدة، يُرجى التواصل مع سكرتارية الكلية.</div>
    </div>
  </div></main>

  <div class="modal" id="formModal" role="dialog" aria-modal="true" aria-label="استمارة استشارة المعهد" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-header"><strong>إستمارة الإستشارة والتسجيل</strong><button type="button" class="tool" id="closeModalTop" aria-label="إغلاق الاستمارة">✕</button></div>
      <div class="modal-frame-viewport"><iframe class="modal-frame" id="formFrame" title="الاستمارة الرسمية للمعهد العالي" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
      <div class="modal-actions"><button type="button" id="closeModalBtn">رجوع للمحادثة</button><a class="yellow" href="https://portal.almahad-alali.com/forms/show/fb?logo=1" target="_blank" rel="noopener noreferrer">فتح الاستمارة في صفحة جديدة</a></div>
    </div>
  </div>

  <div class="modal" id="ratingModal" role="dialog" aria-modal="true" aria-label="تقييم المحادثة" aria-hidden="true">
    <section class="rating" id="ratingPanel">

    return [401,403,404,410].includes(response.status) ||
      ['expired','closed','session_expired'].includes(data?.status) ||
      /expir|invalid.*(session|token)|closed/i.test(String(data?.error_code||''));

      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),cache:'no-store'
    });
    const data=await response.json().catch(()=>({}));
    return {response,data};

  async function startSupport(type){
    const department=supportDepartments[type];
    if(!department||busy||support||ended)return;
    busy=true;
    sendBtn.disabled=true;
    input.disabled=true;
    const typing=addTyping();
    await new Promise(resolve=>setTimeout(resolve,400));
    typing.remove();
    addMessage(department.transfer,'bot');
    try{
      const {response,data}=await supportRequest({
        action:'support_start',support_type:type,
        question:department.question,user_type:'student'
      });
      if(!response.ok||data?.status==='error'||!data?.session_id||!data?.support_token)throw new Error('support_start_failed');
      support={sessionId:String(data.session_id),token:String(data.support_token),lastSeenTs:'0',type};
      saveSupport();
      updateSupportControls();
      addMessage(department.connected,'bot');
      schedulePoll();
    }catch{
      addMessage('تعذر تحويلك إلى الموظف حالياً. يرجى المحاولة مرة أخرى.','bot');
    }finally{
      busy=false;
      sendBtn.disabled=false;
      input.disabled=false;

    input.disabled=true;
    addMessage(text,'user',{time:supportTime()});
    input.value='';
    try{
      const {response,data}=await supportRequest({
        action:'support_message',session_id:current.sessionId,
        support_token:current.token,question:text
      });
      if(isSupportExpired(response,data)){supportExpired();return;}
      if(!response.ok||data?.status==='error')throw new Error('support_message_failed');
    }catch{
      input.value=text;
      addMessage('تعذر تأكيد إرسال رسالتك إلى الدعم. يمكنك إعادة المحاولة.','bot');
    }finally{
      busy=false;
      sendBtn.disabled=false;
      input.disabled=false;
      input.focus();
    }
  }
  function schedulePoll(delay=SUPPORT_POLL_MS){
    stopPolling();
    if(support)pollTimer=setTimeout(pollSupport,delay);
  }
  async function pollSupport(){
    if(polling||!support)return;
    polling=true;
    pollTimer=null;
    const current=support;
    try{
      const {response,data}=await supportRequest({
        action:'support_poll',session_id:current.sessionId,
        support_token:current.token,last_seen_ts:current.lastSeenTs
      });
      if(support!==current||busy)return;
      if(isSupportExpired(response,data)){supportExpired();return;}
      if(!response.ok||data?.status==='error')throw new Error('support_poll_failed');
      statusEl.textContent='';
      const replies=Array.isArray(data?.messages)?data.messages:[];
      for(const message of replies){
        if(support!==current)break;
        const id=String(message?.id||'');
        if(!id||message?.sender!=='human_agent'||typeof message?.text!=='string')continue;
        if(!displayedSupportIds.has(id)){
          addMessage('موظف الدعم: '+message.text,'agent',{time:supportTime(id)});
          displayedSupportIds.add(id);
        }
        try{
          const ack=await supportRequest({
            action:'support_ack',session_id:current.sessionId,
            support_token:current.token,slack_message_ts:id
          });
          if(support!==current)break;
          if(isSupportExpired(ack.response,ack.data)){supportExpired();break;}
          if(!ack.response.ok||ack.data?.status==='error')break;
          current.lastSeenTs=id;
          saveSupport();
        }catch{break;}
      }
    }catch{
      if(support===current)statusEl.textContent='تعذر تحديث ردود الدعم مؤقتاً. ستتم إعادة المحاولة.';
    }finally{
      polling=false;
      if(support)schedulePoll();
    }
  }
  async function closeSupport(next='ai'){
    if(!support||busy)return false;
    if(!confirm('هل تريد إنهاء محادثة الدعم البشري؟'))return false;
    busy=true;
    const current=support;
    stopPolling();
    try{
      const {response,data}=await supportRequest({
        action:'support_close',session_id:current.sessionId,support_token:current.token
      });
      if((!response.ok||data?.status==='error')&&!isSupportExpired(response,data))throw new Error('support_close_failed');
      clearSupport('انتهت محادثة الدعم. يمكنك متابعة الحديث مع هُدى.');
      busy=false;
      if(next==='new')openRating('new');
      else showMenu('main');
      return true;
    }catch{
      statusEl.textContent='تعذر إغلاق جلسة الدعم. يرجى المحاولة مرة أخرى.';
      schedulePoll();
      return false;
    }finally{busy=false;}
  }
  function showMenu(key='main') {
    ensureSession();
    // Never append the same menu if it is already the last visible chat item.
    if (messages.lastElementChild?.dataset.menuKey===key) return;
    const menu=menus[key]; if(!menu) return;
    const {bubble}=addMessage(menu.title,'bot',{menuKey:key});
    const grid=document.createElement('div');grid.className='menu-grid';
    const wrapper=document.createElement('div');wrapper.className='menu';wrapper.append(grid);
    for(const [label,target] of menu.items){
      const btn=document.createElement('button');btn.type='button';btn.className='menu-btn';
      addButtonContent(btn,label,target);
      btn.addEventListener('click',()=>handleMenu(target,label));grid.append(btn);
    }
    bubble.append(wrapper);scrollBottom();
  }
  function showWelcome(){showMenu('main');}
  function openForm() { lastFocus=document.activeElement; modal.classList.add('open');modal.setAttribute('aria-hidden','false');frame.src=FORM_URL;$('closeModalTop').focus(); }
  function closeForm() {
    if(!modal.classList.contains('open'))return;
    modal.classList.remove('open');modal.setAttribute('aria-hidden','true');frame.removeAttribute('src');
    lastFocus?.focus();addMessage('إذا أرسلت الاستمارة وظهرت رسالة نجاح، فينا نكمل هون. هل في شي ثاني بقدر أساعدك فيه؟','bot');
  }
  async function handleMenu(target,label) {
    if (busy || ended || support) return;
    if(target==='secretary'||target==='support_secretary'){await startSupport('secretary');return;}
    if(target==='support_it'||target==='support_contact'){await startSupport('it');return;}
    if(target==='support_consultant'||target==='contact_human'){await startSupport('consultant');return;}
    if(menus[target]) {showMenu(target);return;}
    if(target.startsWith('course_')){await sendMessage(`أريد معلومات عن ${label}: مدة الدراسة، شروط القبول، والمحتوى التعليمي`);return;}
    if(target.startsWith('degree_')){await sendMessage(`أريد معلومات عن مساق ${label} الجامعي: شروط القبول، مدة الدراسة، والشهادة`);return;}
    if(branches[target]){addMessage(label,'user');showBranch(target);return;}
    if(target==='college_about'){showAbout(label);return;}
    if(target==='social_links'){showSocialLinks(label);return;}
    if(target==='support_report'){showSupportContacts(label,true);return;}
    if(target==='support_huda'){await sendMessage('أحتاج مساعدة من هُدى في مشكلة تقنية. ساعديني خطوة بخطوة.');return;}
    if(target==='open_form'){openForm();return;}
    if(target==='other'){input.focus();return;}
    const questions={
      guidance:'ساعديني أختار تخصص مناسب، اسأليني عن اهتماماتي خطوة خطوة',
      branch_other:'ما هي باقي فروع المعهد العالي؟'
    };
    await sendMessage(questions[target]||label);
  }
  async function sendMessage(value=null) {
    if (busy || ended) return;
    if(support){
      if(value!==null)return;
      const supportText=String(value===null?input.value:value).trim();
      if(supportText)await sendSupportMessage(supportText);
      else input.focus();
      return;
    }
    ensureSession();
    const text=String(value===null?input.value:value).trim();
    if(!text){input.focus();return;}
    addMessage(text,'user'); if(value===null)input.value='';
    busy=true;sendBtn.disabled=true;input.disabled=true;statusEl.textContent='';
    const typing=addTyping();
    try{
      // Keep the Worker request identical to the working chat.html contract.
      const body={question:text,user_type:'student',session_id:sessionId};
      const response=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});
      const data=await response.json();
      typing.remove();
      const answer=typeof data?.answer==='string' && data.answer.trim()?data.answer.trim():
        !response.ok && typeof data?.message==='string' && data.message.trim()?data.message.trim():
        response.ok?'لم يتم استلام رد صالح من الخادم.':'تعذر الحصول على رد حالياً. يرجى المحاولة لاحقاً.';
      const {bubble}=addMessage(answer,'bot');
      // Show only explicit backend actions; never make up a successful handoff.
      const suggestions=Array.isArray(data?.suggestions)?data.suggestions.slice(0,6):[];
      const actions=suggestions.filter(x=>typeof x==='string'||(x&&typeof x.label==='string'));
      if(actions.length){
        const grid=document.createElement('div');grid.className='menu-grid';grid.style.marginTop='10px';
        for(const item of actions){
          const label=typeof item==='string'?item:item.label;
          const btn=document.createElement('button');btn.className='menu-btn';btn.type='button';
          addButtonContent(btn,label,item.action||item.id||'other');
          btn.addEventListener('click',()=>sendMessage(label));grid.append(btn);
        }
        bubble.append(grid);
      }
      if(data?.handoff && !suggestions.length){
        const btn=document.createElement('button');btn.type='button';btn.className='menu-btn';btn.style.marginTop='9px';addButtonContent(btn,'فتح استمارة التواصل','registration');btn.addEventListener('click',openForm);bubble.append(btn);
      }
      if(!response.ok)statusEl.textContent='تعذر إتمام الطلب.';
    }catch(error){
      typing.remove();addMessage('تعذر الاتصال بهُدى حالياً. حاول مرة ثانية.','bot');
      statusEl.textContent='مشكلة مؤقتة في الاتصال.';
      console.warn('Huda request failed (details omitted).');
    }finally{
      busy=false;sendBtn.disabled=false;input.disabled=false;input.focus();
    }
  }
  function openRating(action){
    if (busy || support || ratingModal.classList.contains('open')) return;
    ratingAction=action;
    ratingModal.classList.add('open');
    ratingModal.setAttribute('aria-hidden','false');
    $('skipRatingBtn').focus();
  }
  function resetChat(){
    resetSession();
    ended=false;
    selectedRating=0;
    input.disabled=false;
    sendBtn.disabled=false;
    $('homeMenuBtn').disabled=false;
    $('endChatBtn').disabled=false;
    $('ratingComment').value='';
    for(const star of $('stars').children)star.classList.remove('selected');
    messages.replaceChildren();
    statusEl.textContent='';
    showWelcome();
    input.focus();
  }
  function finishRating(submitted=false){
    if(!ratingModal.classList.contains('open'))return;
    if(submitted){
      lastLocalRating={stars:selectedRating,comment:$('ratingComment').value.trim(),recordedAt:new Date().toISOString()};
    }
    ratingModal.classList.remove('open');
    ratingModal.setAttribute('aria-hidden','true');
    const action=ratingAction;
    ratingAction=null;
    if(action==='new'||submitted){
      resetChat();
    }else{
      ended=true;
      input.disabled=true;
      sendBtn.disabled=true;
      $('homeMenuBtn').disabled=true;
      $('endChatBtn').disabled=true;
      statusEl.textContent='انتهت المحادثة. ابدأ محادثة جديدة للمتابعة.';
      $('newChatBtn').focus();
    }
  }
  for(let i=1;i<=5;i++){
    const btn=document.createElement('button');btn.type='button';btn.textContent='★';btn.setAttribute('aria-label',`${i} من 5`);
    btn.addEventListener('click',()=>{selectedRating=i;for(const [j,b]of [...$('stars').children].entries())b.classList.toggle('selected',j<i);});
    $('stars').append(btn);
  }
  $('sendBtn').addEventListener('click',()=>sendMessage());
  chatBox.addEventListener('selectstart',e=>e.preventDefault());
  chatBox.addEventListener('dragstart',e=>e.preventDefault());
  chatBox.addEventListener('copy',e=>e.preventDefault());
  for(const popup of [modal,ratingModal]){
    popup.addEventListener('selectstart',e=>{
      if(!e.target.closest?.('textarea,input'))e.preventDefault();
    });
    popup.addEventListener('dragstart',e=>e.preventDefault());
    popup.addEventListener('copy',e=>e.preventDefault());
  }
  document.addEventListener('copy',e=>{
    const selection=window.getSelection();
    if(selection?.rangeCount && [chatBox,modal,ratingModal].some(area=>selection.getRangeAt(0).intersectsNode(area)))e.preventDefault();
  });
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendMessage();}});
  $('homeMenuBtn').addEventListener('click',()=>{if(!support)showMenu('main');});
  $('newChatBtn').addEventListener('click',async()=>{
    if(support)await closeSupport('new');
    else openRating('new');
  });
  $('endChatBtn').addEventListener('click',async()=>{
    if(support)await closeSupport();
    else openRating('end');
  });
  $('submitRatingBtn').addEventListener('click',()=>finishRating(true));
  $('skipRatingBtn').addEventListener('click',()=>finishRating(false));
  ratingModal.addEventListener('click',e=>{if(e.target===ratingModal)finishRating(false);});
  $('closeModalBtn').addEventListener('click',closeForm);
  $('closeModalTop').addEventListener('click',closeForm);
  modal.addEventListener('click',e=>{if(e.target===modal)closeForm();});
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if(modal.classList.contains('open'))closeForm();
    else if(ratingModal.classList.contains('open'))finishRating(false);
  });
  document.querySelector('.avatar').addEventListener('error',e=>{e.target.style.display='none';});
  initSession();
  try{
    const saved=JSON.parse(sessionStorage.getItem(SUPPORT_STORAGE_KEY)||'null');
    if(saved?.sessionId&&saved?.token&&supportDepartments[saved.type]){
      support={sessionId:String(saved.sessionId),token:String(saved.token),lastSeenTs:String(saved.lastSeenTs||'0'),type:saved.type};
      updateSupportControls();
      addMessage('تمت استعادة جلسة الدعم. يمكنك متابعة المحادثة هنا.','bot');
      schedulePoll(0);
    }else{sessionStorage.removeItem(SUPPORT_STORAGE_KEY);showWelcome();}
  }catch{sessionStorage.removeItem(SUPPORT_STORAGE_KEY);showWelcome();}
})();
</script>
